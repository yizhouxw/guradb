name: 目标的可选外部引用
description: 引用本地目标任务，协作不依赖Issue
title: "[目标] 可验收结果"
body:
  - type: markdown
    attributes:
      value: "本地TASK是唯一协作状态。此表仅用于外部追踪；无需逐子任务建Issue、PM贴标签或用会话ID定义成员。模块标签代表代码域，集成是开发内部职能。"
  - type: input
    id: task
    attributes:
      label: 本地task ID与可访问摘要
      description: "外部读者看不到本机路径时，在此给必要摘要；不复制全部运行记录。"
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: 目标责任角色
      options:
        - role:pm
        - role:product
        - role:architecture
        - role:development
        - role:system-test
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 目标、验收与范围
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已有结果、PR或真实阻塞
      description: "没有证据写未验证，已合并与候选分开；具体技术状态仍在TASK。"
