name: Frozen worker diagnosis
on:
  push:
    branches: ['codex/worker-reproducer']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    name: worker sample (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: '949d484a3d06685d1dcd24cd8fe97a0dee375334'
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.lock -r requirements-m0.lock -r requirements-m1.lock
      - name: Check dependencies and record actual source
        run: |
          python -m pip check
          mkdir -p artifacts/worker-reproducer
          git rev-parse HEAD > artifacts/worker-reproducer/source-sha.txt
      - name: Five independent real samples
        run: |
          status=0
          for iteration in 1 2 3 4 5; do
            timeout --signal=INT --kill-after=30s 900 python scripts/m2_acceptance.py functional --run-dir "artifacts/worker-reproducer/attempt-${iteration}" || status=1
          done
          exit "$status"
      - name: Preserve every sample
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-${{ github.run_id }}-${{ github.run_attempt }}-py${{ matrix.python }}
          path: artifacts/worker-reproducer/
          if-no-files-found: warn
          retention-days: 14
