name: Quality harness

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: "change runs selected gates; release requires real runtime/soak suites"
        type: choice
        options:
          - change
          - release
        default: change
      base:
        description: "all checks the complete tree; otherwise use an existing base ref"
        type: string
        default: all

permissions:
  contents: read

jobs:
  quality:
    name: quality (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.scope == 'release' && 360 || 275 }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    concurrency:
      group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.scope || 'change' }}-${{ inputs.base || 'auto' }}-${{ matrix.python }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      HARNESS_SCOPE: ${{ inputs.scope || 'change' }}
      HARNESS_BASE: ${{ inputs.base || 'auto' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked harness tools
        run: python -m pip install -r requirements-dev.lock -r requirements-m0.lock -r requirements-m1.lock
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Run quality harness
        run: python scripts/harness.py check --scope "$HARNESS_SCOPE" --base "$HARNESS_BASE"
      - name: Preserve quality evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harness-${{ github.run_id }}-${{ github.run_attempt }}-py${{ matrix.python }}
          path: artifacts/harness/
          if-no-files-found: warn
          retention-days: 14
