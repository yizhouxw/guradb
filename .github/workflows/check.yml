name: Quality harness

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: "change runs selected gates; release requires real runtime/soak suites"
        type: choice
        options:
          - change
          - release
        default: change

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HARNESS_SCOPE: ${{ inputs.scope || 'change' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install locked harness tools
        run: python -m pip install -r requirements-dev.lock
      - name: Run quality harness
        run: python scripts/harness.py check --scope "$HARNESS_SCOPE" --base auto
      - name: Preserve quality evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harness-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/harness/
          if-no-files-found: warn
          retention-days: 14
