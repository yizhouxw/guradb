[workspace]
members = ["crates/guradb"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace.dependencies]
apache-avro = { version = "=0.20.0", default-features = false }
libc = "=0.2.191"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
hex = "=0.4.3"
bytes = "=1.10.1"
tokio = { version = "=1.48.0", features = ["full"] }
futures = "=0.3.31"
arrow = { version = "=56.2.0", default-features = false }
parquet = { version = "=56.2.0", features = ["arrow"] }
datafusion = { version = "=50.3.0", default-features = false, features = ["parquet"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
