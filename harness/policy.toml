schema_version = 1
source_extensions = [".rs", ".py", ".go", ".c", ".cc", ".cpp", ".h", ".hpp", ".ts", ".tsx", ".js", ".mjs"]
non_runtime_prefixes = ["scripts/", "tests/", "examples/", "benchmarks/"]
ignored_directories = [".git", ".venv", "node_modules", "target", "build", "dist", "__pycache__", ".pytest_cache", "artifacts/", "data/", "tmp/"]
max_source_lines = 600
bootstrap_suites = ["repository", "policy", "contracts", "harness-tests"]
release_suites = ["unit-coverage", "repository", "policy", "contracts", "harness-tests", "python", "rust", "functional", "performance-smoke", "stability-component", "performance", "stability", "soak"]

[suites.repository]
state = "ready"
timeout_seconds = 60
commands = [["{python}", "scripts/check_repository.py"]]

[suites.policy]
state = "ready"
timeout_seconds = 60
commands = [["{python}", "scripts/harness.py", "lint"]]

[suites.contracts]
state = "ready"
timeout_seconds = 60
commands = [["{python}", "-m", "unittest", "discover", "-s", "tests/contracts", "-p", "test_*.py"]]

[suites.harness-tests]
state = "ready"
timeout_seconds = 120
commands = [["{python}", "-m", "unittest", "discover", "-s", "tests/harness", "-p", "test_*.py"]]

[suites.rust]
state = "ready"
timeout_seconds = 900
commands = [["{python}", "scripts/cargo.py", "fmt", "--all", "--", "--check"], ["{python}", "scripts/cargo.py", "clippy", "--workspace", "--all-targets", "--locked", "--", "-D", "warnings"], ["{python}", "scripts/cargo.py", "test", "--workspace", "--locked"]]

[suites.functional]
state = "ready"
timeout_seconds = 900
commands = [["{python}", "scripts/m0.py", "functional", "--run-dir", "{run_dir}/m0-functional"], ["{python}", "scripts/m1_acceptance.py", "functional", "--run-dir", "{run_dir}/m1-functional"], ["{python}", "scripts/m2_acceptance.py", "functional", "--run-dir", "{run_dir}/m2-functional"], ["{python}", "-m", "unittest", "tests.functional.graph"], ["{python}", "scripts/p0_acceptance.py", "--run-dir", "{run_dir}/p0-local"], ["{python}", "scripts/p0_acceptance.py", "--transport", "http", "--run-dir", "{run_dir}/p0-http"], ["{python}", "scripts/local_acceptance.py", "recovery", "--run-dir", "{run_dir}/m4-recovery"], ["{python}", "scripts/local_acceptance.py", "inspection", "--run-dir", "{run_dir}/state-inspection"], ["{python}", "scripts/local_acceptance.py", "rebuild", "--run-dir", "{run_dir}/index-rebuild"]]

[suites.performance]
state = "planned"
reason = "等待真实 workload driver 与受控 baseline；命令必须包含测量及 compare-performance，不可只返回成功。"
timeout_seconds = 1800
commands = []

[suites.performance-smoke]
state = "ready"
timeout_seconds = 300
commands = [["{python}", "scripts/m0.py", "performance-smoke", "--run-dir", "{run_dir}/m0-performance"], ["{python}", "scripts/m1_acceptance.py", "performance-smoke", "--run-dir", "{run_dir}/m1-performance"], ["{python}", "scripts/m2_acceptance.py", "performance-smoke", "--run-dir", "{run_dir}/m2-performance"], ["{python}", "scripts/p0_acceptance.py", "--transport", "http", "--duration", "60", "--run-dir", "{run_dir}/p0-duration"]]

[suites.stability-component]
state = "ready"
timeout_seconds = 300
commands = [["{python}", "scripts/m0.py", "stability-component", "--run-dir", "{run_dir}/m0-stability"], ["{python}", "scripts/m1_acceptance.py", "stability-component", "--run-dir", "{run_dir}/m1-stability"], ["{python}", "scripts/m2_acceptance.py", "stability-component", "--run-dir", "{run_dir}/m2-stability"]]

[suites.stability]
state = "planned"
reason = "等待真实 fault driver；命令必须执行注入/恢复、产生 trace 并 verify-stability。"
timeout_seconds = 1800
commands = []

[suites.soak]
state = "planned"
reason = "发布前需真实持续负载、资源趋势、重启/滚动升级及恢复证据；当前没有运行服务。"
timeout_seconds = 3600
commands = []

[suites.python]
state = "ready"
timeout_seconds = 60
commands = [["{python}", "-m", "compileall", "-q", "modules", "clients", "scripts/m1.py", "scripts/m1_acceptance.py", "scripts/m2_acceptance.py", "scripts/p0_acceptance.py", "scripts/local_acceptance.py", "scripts/m4.py", "scripts/worker.py", "scripts/inspect_state.py", "scripts/sbom.py", "scripts/m1lib", "scripts/m2lib", "scripts/p0lib"], ["{python}", "-m", "pip", "check"]]

[suites.unit-coverage]
state = "ready"
timeout_seconds = 900
commands = [["{python}", "scripts/unit_coverage.py", "--language", "all", "--run-dir", "{run_dir}/unit-coverage"]]
