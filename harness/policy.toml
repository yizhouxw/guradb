schema_version = 1
source_extensions = [".rs", ".py", ".go", ".c", ".cc", ".cpp", ".h", ".hpp", ".ts", ".tsx", ".js", ".mjs"]
non_runtime_prefixes = ["scripts/", "tests/", "examples/", "benchmarks/"]
ignored_directories = [".git", ".venv", "node_modules", "target", "build", "dist", "__pycache__", ".pytest_cache", "artifacts/", "data/", "tmp/"]
max_source_lines = 600
bootstrap_suites = ["repository", "policy", "harness-tests"]
release_suites = ["repository", "policy", "harness-tests", "python", "rust", "functional", "unit-coverage", "performance", "stability", "soak"]

[suites.repository]
state = "ready"
timeout_seconds = 60
commands = [["{python}", "scripts/check_repository.py"]]
[suites.policy]
state = "ready"
timeout_seconds = 60
commands = [["{python}", "scripts/harness.py", "lint"]]
[suites.harness-tests]
state = "ready"
timeout_seconds = 120
commands = [["{python}", "-m", "unittest", "discover", "-s", "tests/harness", "-p", "test_*.py"]]
[suites.python]
state = "ready"
timeout_seconds = 60
commands = [["{python}", "-m", "compileall", "-q", "scripts", "tests/harness"]]
[suites.rust]
state = "ready"
timeout_seconds = 900
commands = [["{python}", "scripts/cargo.py", "fmt", "--all", "--", "--check"], ["{python}", "scripts/cargo.py", "clippy", "--workspace", "--all-targets", "--locked", "--", "-D", "warnings"], ["{python}", "scripts/cargo.py", "test", "--workspace", "--locked"]]
[suites.functional]
state = "ready"
timeout_seconds = 300
commands = [["{python}", "scripts/alpha_acceptance.py", "--run-dir", "{run_dir}/alpha-real-cli"]]
[suites.unit-coverage]
state = "planned"
reason = "ADR0028 core scope has source binding and real process tests; full applicable Rust100/Python80 coverage qualification remains unverified for hardening/release, no old exclusions transferred."
timeout_seconds = 900
commands = []
[suites.performance-smoke]
state = "planned"
reason = "Retired legacy demo drivers; new alpha performance qualification not yet implemented."
timeout_seconds = 300
commands = []
[suites.stability-component]
state = "planned"
reason = "Old provider/PG/worker faults retired. Current real process cleanup is covered by Rust CLI tests, broader fault qualification remains planned."
timeout_seconds = 300
commands = []
[suites.contracts]
state = "planned"
reason = "Old HTTP/PG/multimodal wire contracts retired; current CLI source/hash/result contract is exercised by real functional driver and Rust process tests."
timeout_seconds = 60
commands = []
[suites.performance]
state = "planned"
reason = "Full controlled performance/baseline remains unverified."
timeout_seconds = 1800
commands = []
[suites.stability]
state = "planned"
reason = "Complete fault registry remains unverified."
timeout_seconds = 1800
commands = []
[suites.soak]
state = "planned"
reason = "Full long-running/restart/release qualification remains unverified."
timeout_seconds = 3600
commands = []
