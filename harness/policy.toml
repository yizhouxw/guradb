schema_version = 1
source_extensions = [".rs", ".py", ".go", ".c", ".cc", ".cpp", ".h", ".hpp", ".ts", ".tsx", ".js", ".mjs"]
non_runtime_prefixes = ["scripts/", "tests/", "examples/", "benchmarks/"]
ignored_directories = [".git", ".venv", "node_modules", "target", "build", "dist", "__pycache__", ".pytest_cache", "artifacts/", "data/", "tmp/"]
max_source_lines = 600
bootstrap_suites = ["repository", "policy", "contracts", "harness-tests"]
release_suites = ["repository", "policy", "contracts", "harness-tests", "rust", "functional", "performance-smoke", "stability-component", "performance", "stability", "soak"]

[suites.repository]
state = "ready"
timeout_seconds = 60
commands = [["{python}", "scripts/check_repository.py"]]

[suites.policy]
state = "ready"
timeout_seconds = 60
commands = [["{python}", "scripts/harness.py", "lint"]]

[suites.contracts]
state = "ready"
timeout_seconds = 60
commands = [["{python}", "-m", "unittest", "discover", "-s", "tests/contracts", "-p", "test_*.py"]]

[suites.harness-tests]
state = "ready"
timeout_seconds = 120
commands = [["{python}", "-m", "unittest", "discover", "-s", "tests/harness", "-p", "test_*.py"]]

[suites.rust]
state = "planned"
reason = "首个 Rust workspace 落地时固定 toolchain、Cargo.lock，再启用 fmt/clippy/test --locked。"
timeout_seconds = 900
commands = []

[suites.functional]
state = "planned"
reason = "等待真实内核/客户端：注册单元、差异、属性与集成测试，不能用 harness 测试代替数据库功能测试。"
timeout_seconds = 900
commands = []

[suites.performance]
state = "planned"
reason = "等待真实 workload driver 与受控 baseline；命令必须包含测量及 compare-performance，不可只返回成功。"
timeout_seconds = 1800
commands = []

[suites.performance-smoke]
state = "planned"
reason = "等待当前切片的真实组件测量与预冻结预算；首次建立实测基线，后续比较回归，不能用整库未实现阻塞首个组件或自比较造绿。"
timeout_seconds = 300
commands = []

[suites.stability-component]
state = "planned"
reason = "等待当前切片真实的失败/重试/取消或恢复测试及日志；不冒充完整多节点 fault registry。"
timeout_seconds = 300
commands = []

[suites.stability]
state = "planned"
reason = "等待真实 fault driver；命令必须执行注入/恢复、产生 trace 并 verify-stability。"
timeout_seconds = 1800
commands = []

[suites.soak]
state = "planned"
reason = "发布前需真实持续负载、资源趋势、重启/滚动升级及恢复证据；当前没有运行服务。"
timeout_seconds = 3600
commands = []
